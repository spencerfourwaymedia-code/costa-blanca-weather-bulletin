name: Daily Costa Blanca Weather Bulletin

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate-weather-bulletin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Download Weather Data
        run: |
          python << 'EOF'
          import requests, json

          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=38.345"
              "&longitude=-0.481"
              "&daily=weather_code,temperature_2m_max,temperature_2m_min"
              "&timezone=Europe/Madrid"
              "&forecast_days=2"
          )

          data = requests.get(url, timeout=30).json()

          with open("weather.json", "w") as f:
              json.dump(data, f)
          EOF

      - name: Generate Forecast Script (Gemini)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python << 'EOF'
          import requests
          import json
          import time
          from datetime import datetime

          weather = json.load(open("weather.json"))

          template = open(
              "prompts/prompt-template.txt",
              "r",
              encoding="utf-8"
          ).read()

          current_time = datetime.now().strftime("%Y-%m-%d %H:%M")

          alerts_text = "No active alerts"

          prompt = f"""
          {template}

          Current local date/time:
          {current_time}

          Forecast JSON:
          {json.dumps(weather, indent=2)}

          Alerts:
          {alerts_text}
          """

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash:generateContent"
              f"?key=${{ secrets.GOOGLE_API_KEY }}"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          for attempt in range(5):

              response = requests.post(
                  url,
                  json=payload,
                  timeout=60
              )

              print(f"Attempt {attempt+1}")
              print(response.text)

              data = response.json()

              if (
                  response.status_code == 200
                  and "candidates" in data
              ):
                  parts = data["candidates"][0]["content"]["parts"]

                  script = "".join(
                      p.get("text", "")
                      for p in parts
                  )

                  with open(
                      "bulletin.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(script)

                  print(script)
                  break

              if response.status_code == 503:
                  time.sleep(10)
                  continue

              raise SystemExit(
                  "Gemini Error:\n" + response.text
              )

          else:
              raise SystemExit(
                  "Gemini unavailable after 5 retries."
              )
          EOF

