name: Daily Costa Blanca Weather Bulletin

on:
  schedule:
    - cron: "0 6 * * *"   # Runs every day at 06:00 UTC
  workflow_dispatch:       # Allows manual runs

jobs:
  generate-weather-bulletin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install requests

    - name: Fetch Costa Blanca Weather
      id: weather
      run: |
        python << 'EOF'
        import requests, json

        url = "https://api.open-meteo.com/v1/forecast?latitude=38.345&longitude=-0.481&hourly=temperature_2m,wind_speed_10m,precipitation_probability"

        data = requests.get(url).json()
        with open("weather.json", "w") as f:
            json.dump(data, f)
        EOF

    - name: Generate Weather Script with Gemini (Retry + Full Output)
      id: script
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python << 'EOF'
        import requests, json, time

        # Load weather data
        weather = json.load(open("weather.json"))

        # Build prompt
        prompt = f"""
        Write a 35-second Costa Blanca weather bulletin for radio.
        Tone: British radio, present tense, tight pacing, spoken-friendly.
        Use this weather data:
        {json.dumps(weather)}
        """

        # Gemini 3.5 Flash endpoint
        url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${{ secrets.GOOGLE_API_KEY }}"

        payload = {
            "contents": [
                {
                    "parts": [
                        {"text": prompt}
                    ]
                }
            ]
        }

        # Retry logic for Gemini overload (503)
        for attempt in range(5):
            r = requests.post(url, json=payload)
            print(f"Attempt {attempt + 1} response:")
            print(r.text)

            data = r.json()

            # Success case
            if r.status_code == 200 and "candidates" in data:
                parts = data["candidates"][0]["content"]["parts"]
                script = "".join(p.get("text", "") for p in parts)

                with open("bulletin.txt", "w") as f:
                    f.write(script)
                break

            # Retry on overload
            if r.status_code == 503:
                time.sleep(10)
                continue

            # Any other error → fail immediately
            raise SystemExit("Gemini failed: " + r.text)

        else:
            raise SystemExit("Gemini failed after 5 retries.")
        EOF


    - name: Install Google Cloud TTS dependencies
      run: |
        pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

    - name: Convert Script to MP3 (Google Cloud TTS)
      id: tts
      env:
        GOOGLE_TTS_KEY_B64: ${{ secrets.GOOGLE_TTS_KEY_B64 }}
      run: |
        python << 'EOF'
        import json, base64
        from google.oauth2 import service_account
        import google.auth.transport.requests
        import requests

        # Decode the base64 service account JSON
        creds_json = base64.b64decode("${{ secrets.GOOGLE_TTS_KEY_B64 }}").decode("utf-8")
        creds_info = json.loads(creds_json)

        # Authenticate
        creds = service_account.Credentials.from_service_account_info(
            creds_info,
            scopes=["https://www.googleapis.com/auth/cloud-platform"]
        )

        auth_req = google.auth.transport.requests.Request()
        creds.refresh(auth_req)
        token = creds.token

        # Read the bulletin text
        text = open("bulletin.txt").read()

        # Google Cloud TTS endpoint
        url = "https://texttospeech.googleapis.com/v1/text:synthesize"

        payload = {
            "input": {"text": text},
            "voice": {
                "languageCode": "en-GB",
                "name": "en-GB-Neural2-C"
            },
            "audioConfig": {
                "audioEncoding": "MP3",
                "speakingRate": 1.0,
                "pitch": 0.0
            }
        }

        headers = {
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json"
        }

        r = requests.post(url, json=payload, headers=headers)

        if r.status_code != 200:
            raise SystemExit("TTS failed: " + r.text)

        audio_b64 = r.json()["audioContent"]
        audio_bytes = base64.b64decode(audio_b64)

        with open("costa-blanca-weather.mp3", "wb") as f:
            f.write(audio_bytes)
        EOF

    - name: Upload MP3 as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: costa-blanca-weather
        path: costa-blanca-weather.mp3
