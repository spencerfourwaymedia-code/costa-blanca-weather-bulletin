name: Daily Costa Blanca Weather Bulletin

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  generate-weather-bulletin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Download Weather Data
        run: |
          python << 'EOF'
          import requests
          import json

          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=38.345"
              "&longitude=-0.481"
              "&daily=weather_code,temperature_2m_max,temperature_2m_min"
              "&timezone=Europe/Madrid"
              "&forecast_days=2"
          )

          data = requests.get(url, timeout=30).json()

          with open("weather.json", "w") as f:
              json.dump(data, f)

          print("Weather data downloaded.")
          EOF

      - name: Generate Forecast Script (Gemini)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python << 'EOF'
          import requests
          import json
          import time
          import os

          from datetime import datetime

          weather = json.load(
              open("weather.json")
          )

          template = open(
              "prompt-template.txt",
              "r",
              encoding="utf-8"
          ).read()

          current_time = datetime.now().strftime(
              "%Y-%m-%d %H:%M"
          )

          alerts_text = "No active alerts"

          prompt = f"""
          {template}

          Current local date/time:
          {current_time}

          Forecast JSON:
          {json.dumps(weather, indent=2)}

          Alerts:
          {alerts_text}
          """

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash:generateContent"
              f"?key={os.environ['GOOGLE_API_KEY']}"
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          for attempt in range(5):

              response = requests.post(
                  url,
                  json=payload,
                  timeout=60
              )

              print(
                  f"Gemini Attempt {attempt + 1}"
              )

              data = response.json()

              if (
                  response.status_code == 200
                  and "candidates" in data
              ):

                  parts = data[
                      "candidates"
                  ][0]["content"]["parts"]

                  script = "".join(
                      p.get("text", "")
                      for p in parts
                  )

                  with open(
                      "bulletin.txt",
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(script)

                  print(script)

                  break

              if response.status_code == 503:
                  time.sleep(10)
                  continue

              raise SystemExit(
                  "Gemini Error:\n"
                  + response.text
              )

          else:

              raise SystemExit(
                  "Gemini unavailable after 5 retries."
              )
          EOF

      - name: Generate Audio with ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python << 'EOF'
          import requests
          import os

          with open(
              "bulletin.txt",
              "r",
              encoding="utf-8"
          ) as f:

              text = f.read()

          voice_id = "MzqUf1HbJ8UmQ0wUsx2p"

          url = (
              f"https://api.elevenlabs.io/"
              f"v1/text-to-speech/{voice_id}"
          )

          headers = {
              "xi-api-key":
                  os.environ[
                      "ELEVENLABS_API_KEY"
                  ],
              "Content-Type":
                  "application/json"
          }

          payload = {
              "text": text,
              "model_id":
                  "eleven_multilingual_v2",
              "voice_settings": {
                  "stability": 0.32,
                  "similarity_boost": 0.85,
                  "style": 0.55,
                  "use_speaker_boost": True
              }
          }

          response = requests.post(
              url,
              json=payload,
              headers=headers,
              timeout=120
          )

          if response.status_code != 200:

              raise SystemExit(
                  "ElevenLabs Error:\n"
                  + response.text
              )

          with open(
              "costa-blanca-weather.mp3",
              "wb"
          ) as f:

              f.write(
                  response.content
              )

          print(
              "MP3 generated successfully"
          )
          EOF

      - name: Upload MP3 to Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python << 'EOF'
          import requests
          import json
          import os

          token_response = requests.post(
              "https://api.dropboxapi.com/oauth2/token",
              data={
                  "grant_type":
                      "refresh_token",
                  "refresh_token":
                      os.environ[
                          "DROPBOX_REFRESH_TOKEN"
                      ],
                  "client_id":
                      os.environ[
                          "DROPBOX_APP_KEY"
                      ],
                  "client_secret":
                      os.environ[
                          "DROPBOX_APP_SECRET"
                      ]
              },
              timeout=30
          )

          token_response.raise_for_status()

          access_token = (
              token_response.json()[
                  "access_token"
              ]
          )

          print(
              "Dropbox access token refreshed."
          )

          with open(
              "costa-blanca-weather.mp3",
              "rb"
          ) as f:

              audio = f.read()

          headers = {
              "Authorization":
                  f"Bearer {access_token}",
              "Dropbox-API-Arg":
                  json.dumps({
                      "path":
                          "/Radio/Weather/costa-blanca-weather.mp3",
                      "mode":
                          "overwrite",
                      "autorename":
                          False
                  }),
              "Content-Type":
                  "application/octet-stream"
          }

          response = requests.post(
              "https://content.dropboxapi.com/2/files/upload",
              headers=headers,
              data=audio,
              timeout=120
          )

          print(response.text)

          response.raise_for_status()

          print(
              "Dropbox upload successful."
          )
          EOF
